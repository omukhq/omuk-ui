<!doctype html>
<!--
  The source of public/apple-touch-icon.png (180 × 180): the favicon's mark,
  a button on a tile, on the theme's primary (gray-950) and white.
  `bun scripts/images.ts` renders it with headless Chrome.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; }
      body { width: 180px; height: 180px; background: #030712; display: grid; place-items: center; }
      div { width: 100px; height: 40px; border-radius: 20px; background: #ffffff; }
    </style>
  </head>
  <body><div></div></body>
</html>
