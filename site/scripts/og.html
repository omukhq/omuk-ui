<!doctype html>
<!--
  The source of public/og.png (1200 × 630), the link preview.
  `bun scripts/images.ts` renders it with headless Chrome. An image is not
  site code: the values below are the theme's (gray-950, gray-600, gray-50,
  white), written out because a PNG cannot read CSS variables.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 400;
        src: url("../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2");
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 600;
        src: url("../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2");
      }
      html, body { margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 96px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: #ffffff;
        color: #030712;
        font-family: "IBM Plex Sans", sans-serif;
      }
      h1 { margin: 0; font-size: 96px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
      p { margin: 24px 0 0; font-size: 40px; line-height: 1.25; color: #4b5563; max-width: 900px; }
      .row { display: flex; gap: 24px; align-items: center; }
      .button {
        display: grid;
        place-items: center;
        height: 72px;
        padding: 0 32px;
        border-radius: 12px;
        background: #030712;
        color: #ffffff;
        font-size: 32px;
        font-weight: 600;
      }
      .button span { grid-area: 1 / 1; }
      .hidden { visibility: hidden; }
      .spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: #ffffff;
        box-sizing: border-box;
      }
      .ghost { background: #f9fafb; color: #030712; box-shadow: inset 0 0 0 3px #e5e7eb; }
      .note { font-size: 28px; color: #4b5563; }
    </style>
  </head>
  <body>
    <div>
      <h1>Omuk UI</h1>
      <p>React 19 components and design tokens for Tailwind CSS 4.</p>
    </div>
    <div class="row">
      <div class="button"><span class="hidden">Save</span><span class="spinner"></span></div>
      <div class="button ghost">Cancel</div>
      <div class="note">A loading button keeps its size.</div>
    </div>
  </body>
</html>
